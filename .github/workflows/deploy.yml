# Deploy only after the complete Check workflow succeeds on main.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (ed25519 private key).
# Server path: /opt/gamehot  — .env is never overwritten.
name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify the checked commit is still main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CHECKED_SHA" != "$latest_sha" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an outdated Check result; main has a newer commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Deploying checked commit: $CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the checked commit
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Package the checked commit
        if: steps.revision.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          git bundle create aihot-deploy.bundle HEAD
          git bundle verify aihot-deploy.bundle
      # Send the checked Git object database through the existing SSH channel. The VPS no longer
      # needs outbound GitHub access, which is unreliable on some mainland routes.
      - name: Upload the checked commit
        if: steps.revision.outputs.deploy == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: aihot-deploy.bundle
          target: /tmp
          overwrite: true
          command_timeout: 10m
      - name: Prepare the checked release
        if: steps.revision.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: CHECKED_SHA
          command_timeout: 40m
          script: |
            set -euo pipefail
            BUNDLE=/tmp/aihot-deploy.bundle
            trap 'rm -f "$BUNDLE"' EXIT
            test -s "$BUNDLE"
            cd /opt/gamehot
            git fetch "$BUNDLE" HEAD
            if [ "$(git rev-parse FETCH_HEAD)" != "$CHECKED_SHA" ]; then
              echo "Uploaded bundle does not contain the checked commit" >&2
              exit 1
            fi
            git update-ref refs/remotes/origin/main "$CHECKED_SHA"
            git reset --hard "$CHECKED_SHA"
            # Keep existing .env; rebuild and restart (China npm mirror)
            sudo docker compose build --build-arg NPM_REGISTRY=https://registry.npmmirror.com
      - name: Verify the built commit is still main
        if: steps.revision.outputs.deploy == 'true'
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CHECKED_SHA" != "$latest_sha" ]; then
            echo "activate=false" >> "$GITHUB_OUTPUT"
            echo "Built commit is no longer main; running services were left unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "activate=true" >> "$GITHUB_OUTPUT"
      - name: Activate the checked release
        if: steps.current.outputs.activate == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: CHECKED_SHA
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/gamehot
            test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
            sudo docker compose stop api worker web
            sudo docker compose run --rm setup
            sudo docker compose up -d
            sudo docker compose ps
            sudo docker compose exec -T web node --input-type=module - <<'NODE'
            let healthy = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3000/api/health", { signal: AbortSignal.timeout(3000) });
                const body = await response.json();
                if (response.ok && body.ok === true && body.db === "ok") {
                  healthy = true;
                  break;
                }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (!healthy) throw new Error("Deployment health check failed");
            console.log("Deployment health check passed");
            NODE
            sudo docker compose exec -T web node scripts/smoke.ts --base http://127.0.0.1:3000
