# Official GitHub actions, pinned to full commits. Complete Check still gates Deploy.
name: Check
on:
  push:
    branches: [main]
    paths-ignore: ['README', 'README.md', 'README.*.md', 'README.txt', 'README.rst', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/pull_request_template.md']
  # Workflow-level PR path filters would leave required checks pending.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A shared main group also discards older pending runs, even with cancellation disabled.
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SITE_URL: http://127.0.0.1:3000
  API_BASE_URL: http://127.0.0.1:3001
  SESSION_SECRET: ci-session-secret-0123456789abcdef
  IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        # Runner's Node 22+ supports native type stripping; this script imports only Node builtins.
        run: node scripts/ci/changes.ts

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Online migration safety
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: node scripts/check-migrations.ts --base "$MIGRATION_BASE"
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Share the exact production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/build/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL backup tools
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/17/bin/pg_restore ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client-17
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Backend tests
        # Node options must precede file patterns; npm test -- would append them after the globs.
        run: node --test-global-setup=tests/databases.ts --import ./tests/databases.ts --test --test-concurrency=6 --test-timeout=120000 --test-shard=${{ matrix.shard }}/3 "tests/*.test.ts" "modules/*/tests/*.test.ts"

  browser:
    # These jobs consume verify's build, not a second independently rebuilt bundle.
    needs: [changes, verify]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Browser binary cache
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Browser system libraries
        run: npx playwright install-deps chromium webkit
      - name: Browser binaries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Restore the production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/build/
      - name: Web tests
        run: node --test --test-shard=${{ matrix.shard }}/2 apps/web/tests/*.test.ts

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MCP check dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure a throwaway site
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          echo "MCP_ALLOWED_HOSTS=web,127.0.0.1" >> .env
      - name: Build and start with docker compose
        run: docker compose up -d --build
      - name: Smoke check
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v

  # Preserve stable status names, including documentation-only PRs.
  web:
    if: always()
    needs: [changes, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all browser shards or an explicit documentation skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const r = JSON.parse(process.env.RESULTS);
          const expected = r.changes.outputs.code === 'true' ? 'success' : 'skipped';
          if (r.changes.result !== 'success' || r.browser.result !== expected) process.exit(1);
          console.log(expected === 'skipped' ? 'Documentation only; browser checks not needed.' : 'All browser shards passed.');
          NODE

  check:
    if: always()
    needs: [changes, verify, backend, web, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const r = JSON.parse(process.env.RESULTS);
          if (r.changes.result !== 'success' || r.web.result !== 'success') process.exit(1);
          const expected = r.changes.outputs.code === 'true' ? 'success' : 'skipped';
          for (const name of ['verify', 'backend', 'docker']) if (r[name].result !== expected) process.exit(1);
          console.log(expected === 'skipped' ? 'Documentation only; required checks completed.' : 'All validations passed.');
          NODE
